<style>
:root{--navy:#06142e;--navy2:#0d2a57;--gold:#d4a93a;--gold2:#f2cf6a;--gd:#8a6407;--bg:#f7f8fb;--line:#e3e7ef;--ink:#14182b;--mut:#4d566c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font:17px/1.7 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 28px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gd),var(--gold2));z-index:60}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
header.sc{box-shadow:0 6px 24px rgba(6,20,46,.08)}
header .wrap{display:flex;align-items:center;height:70px}
header img{height:40px;display:block}
nav{margin-left:auto;display:flex;gap:28px;align-items:center}
nav a:not(.btn){text-decoration:none;font-size:15px;font-weight:500;color:var(--mut);position:relative;padding:6px 0}
nav a:not(.btn):hover,nav a.on{color:var(--navy)}
nav a.on:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 30px;border-radius:999px;font:700 16px "DM Sans",sans-serif;text-decoration:none;border:2px solid var(--gold);cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.btn.fill{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy)}
.btn.fill:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(212,169,58,.4)}
.btn.line{color:#fff}.btn.line:hover{background:#fff;border-color:#fff;color:var(--navy)}
nav .btn{padding:9px 20px;font-size:14px}
#burger{display:none;margin-left:auto;background:none;border:0;width:44px;height:44px;cursor:pointer;position:relative}
#burger i,#burger i:before,#burger i:after{display:block;width:24px;height:2px;background:var(--navy);content:"";margin:auto;transition:.25s}
#burger i{position:relative}#burger i:before,#burger i:after{position:absolute;left:0}#burger i:before{top:-7px}#burger i:after{top:7px}
.hero{background:radial-gradient(820px 480px at 92% 0,rgba(31,74,140,.55),transparent 62%),var(--navy);color:#fff;padding:104px 0 120px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/30px 30px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 65%);mask-image:linear-gradient(90deg,#000,transparent 65%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.who{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--gold2);margin-bottom:24px}
.who:before{content:"";width:28px;height:2px;background:var(--gold2)}
h1{font-size:clamp(38px,5.4vw,64px);font-weight:800;max-width:11.5em}
.rot{margin-top:24px;font-size:clamp(19px,2.3vw,24px);color:#d7dcea;min-height:1.6em}
.rot b{color:var(--gold2);font-weight:700;border-right:2px solid var(--gold2);padding-right:4px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{border-color:transparent}}
.sub{max-width:32em;margin-top:18px;font-size:18.5px;color:#c4cbdd}
.cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:38px}
.vis{display:grid;gap:18px;max-width:380px;margin-left:auto;width:100%}
.gc{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:22px 24px;backdrop-filter:blur(6px);display:flex;align-items:center;gap:14px}
.g1 i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.g1 b{margin-left:auto;font:800 38px "Bricolage Grotesque",sans-serif;color:var(--gold2)}
.g2{font:14px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#c9d6f2;margin-left:28px;animation:fl 7s ease-in-out infinite}
.g2 em{color:var(--gold2);font-style:normal}
.g3{margin-right:28px}.g3 svg{width:100%}
.ln path{stroke-dasharray:4 6;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes fl{50%{transform:translateY(-8px)}}
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding-top:26px;padding-bottom:26px}
.trust div{display:flex;gap:12px;align-items:center;font-weight:500;color:var(--navy)}
.trust svg{flex:none;width:28px;height:28px;padding:6px;border-radius:50%;background:var(--navy);stroke:var(--gold2);fill:none;stroke-width:3}
section{padding:112px 0}
h2{font-size:clamp(30px,4vw,44px);font-weight:800;color:var(--navy);max-width:16em}
.lead{max-width:38em;margin-top:16px;color:var(--mut)}
.tabs{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:40px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:999px}
.tab{border:0;background:none;border-radius:999px;padding:10px 24px;font:700 15px "DM Sans",sans-serif;cursor:pointer;color:var(--mut);transition:.2s}
.tab:hover{color:var(--navy)}.tab.on{background:var(--navy);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;margin-top:32px}
.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 30px 28px;transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .45s both}
.card:before{content:"";width:34px;height:4px;border-radius:2px;background:var(--gold);margin-bottom:22px}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(6,20,46,.1);border-color:var(--gold)}
.card h3{font-size:21px;margin-bottom:10px;color:var(--navy)}
.card p{color:var(--mut);font-size:16px}
.ql{display:inline-block;margin-top:auto;padding-top:20px;font-weight:700;font-size:15px;color:var(--gd);text-decoration:none}
.ql:after{content:" →";transition:margin .2s}.ql:hover{color:var(--navy)}.ql:hover:after{margin-left:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.white{background:#fff}
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:48px}
.work{position:relative;aspect-ratio:4/5;background:linear-gradient(160deg,var(--navy2),var(--navy));color:#fff;overflow:hidden;display:flex;align-items:flex-end;border-radius:22px;transition:transform .3s,box-shadow .3s}
.work:hover{transform:translateY(-6px);box-shadow:0 22px 46px rgba(6,20,46,.22)}
.work svg,.work img{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s}
.work img{object-fit:cover;cursor:zoom-in}
.work:hover svg,.work:hover img{transform:scale(1.05)}
.work figcaption{position:relative;width:100%;padding:56px 22px 20px;background:linear-gradient(0deg,rgba(6,20,46,.96),rgba(6,20,46,0));font-weight:700;font-size:18px;pointer-events:none}
.work small{display:block;font-weight:400;font-size:14px;color:#c9d0e3}
.work .ql{color:var(--gold2);pointer-events:auto;padding-top:8px;font-size:14.5px}.work .ql:hover{color:#fff}
#lb{position:fixed;inset:0;background:rgba(6,20,46,.92);display:none;align-items:center;justify-content:center;z-index:80;padding:24px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:12px}
.about{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;align-items:center}
.av{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);margin-bottom:24px;display:grid;place-items:center;background:var(--navy);color:var(--gold2);font:800 38px "Bricolage Grotesque",sans-serif}
.pillars{display:grid;gap:16px}
.pil{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 26px;transition:transform .25s,box-shadow .25s}
.pil:hover{transform:translateX(6px);box-shadow:0 12px 28px rgba(6,20,46,.08)}
.pil b{display:block;color:var(--navy);font:800 20px "Bricolage Grotesque",sans-serif}.pil span{color:var(--mut);font-size:16px}
.band{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}
.band h2{color:#fff}.band .lead{color:#c9d0e3}
.steps{list-style:none;padding:0;margin-top:52px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:32px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid rgba(242,207,106,.45);padding-top:18px}
.steps li:before{content:counter(s);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy);font:800 20px "Bricolage Grotesque",sans-serif;margin-bottom:14px}
.steps b{display:block;margin-bottom:6px;font:800 20px "Bricolage Grotesque",sans-serif}
.steps span{color:#c9d0e3;font-size:16px}
.price{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:center}
.price ul{list-style:none;padding:12px 28px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 34px rgba(6,20,46,.06)}
.price li{padding:16px 0 16px 36px;border-bottom:1px solid var(--line);position:relative;font-weight:500;color:var(--navy)}
.price li:last-child{border:0}
.price li:before{content:"";position:absolute;left:4px;top:22px;width:12px;height:7px;border-left:3px solid var(--gd);border-bottom:3px solid var(--gd);transform:rotate(-45deg)}
footer{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#e3e8f5;padding:104px 0 44px}
footer .wrap>div{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
footer h2{color:#fff}footer .lead{color:#c9d0e3}
.phones{margin-top:26px;font-size:18px}.phones a{font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold)}
.fm{display:grid;gap:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:30px}
.fm label{display:grid;gap:6px;font-weight:500;font-size:15px}
.fm input,.fm select,.fm textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid transparent;border-radius:12px;padding:12px 14px}
.fm textarea{resize:vertical}
small.cp{display:block;margin-top:64px;padding-top:24px;border-top:1px solid rgba(255,255,255,.15);color:#a9b4cf;font-size:14px}
.soc{display:flex;gap:12px;margin-top:28px}
.soc a{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;transition:.2s}
.soc svg{width:21px;height:21px;fill:var(--gold2);transition:.2s}
.soc a:hover{background:var(--gold);transform:translateY(-3px)}.soc a:hover svg{fill:var(--navy)}
.soc a:not([href]){opacity:.5;cursor:default}.soc a:not([href]):hover{background:none;transform:none}.soc a:not([href]):hover svg{fill:var(--gold2)}
.soc.sm{margin-top:22px}.soc.sm a{width:40px;height:40px;border-color:var(--gd)}.soc.sm svg{width:19px;height:19px;fill:var(--gd)}.soc.sm a:hover svg{fill:var(--navy)}
.wa{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;z-index:55;box-shadow:0 8px 22px rgba(0,0,0,.28);animation:pl 2.6s infinite}
.wa svg{width:30px;height:30px;fill:#fff}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55),0 8px 22px rgba(0,0,0,.28)}70%,100%{box-shadow:0 0 0 18px rgba(37,211,102,0),0 8px 22px rgba(0,0,0,.28)}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
@media(max-width:900px){
#burger{display:block}
nav{position:absolute;top:70px;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;gap:4px;padding:14px 28px 22px;border-bottom:1px solid var(--line);display:none}
nav.open{display:flex}nav a:not(.btn){padding:12px 0}nav .btn{margin-top:8px}
section{padding:72px 0}.hero{padding:64px 0 72px}
.hero .wrap,.price,.about,footer .wrap>div{grid-template-columns:1fr;gap:36px}
.vis{margin:0;max-width:none}.g2{margin-left:0}.g3{margin-right:0}
body{font-size:16.5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}
.car{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.work .car img{position:static;flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;cursor:zoom-in}
.cb{position:absolute;top:40%;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--navy);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cb.p{left:10px}.cb.n{right:10px}
.dots{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i.on{background:var(--gold2)}
.work .car{pointer-events:auto}
#lb{flex-direction:column;gap:14px;cursor:default}
#lb img{max-height:calc(100% - 64px);object-fit:contain}
#lx{position:absolute;top:16px;right:16px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:30px;line-height:1;cursor:pointer;z-index:2}
#lt{color:#fff;font-weight:700;text-align:center}
.lg{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--navy);font-size:26px;line-height:1;cursor:pointer;z-index:2}
.lg.p{left:14px}.lg.n{right:14px}#lb.one .lg{display:none}
</style>
</head>
